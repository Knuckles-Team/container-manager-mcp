[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "container-manager-mcp"
version = "3.3.3"
description = "Container Manager - manage Docker, Docker Swarm, and Podman containers. MCP+A2A Servers Out of the Box!"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0", "docker[ssh]>=7.2.0", "tunnel-manager>=2.1.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
podman = [ "podman>=5.8.0",]
docker = [ "docker[ssh]>=7.2.0",]
kubernetes = [ "kubernetes>=37.0.1",]
mcp = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0", "docker[ssh]>=7.2.0", "podman>=5.8.0", "kubernetes>=37.0.1",]
all = [ "container-manager-mcp[docker,podman,kubernetes,mcp]>=2.3.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
container-manager-mcp = "container_manager_mcp.mcp_server:mcp_server"
container-manager-doctor = "container_manager_mcp.doctor:doctor"
container-manager-save-context = "container_manager_mcp.k8s.kubeconfig_import:main"

[project.entry-points."agent_connector_sdk.skill_providers"]
container-manager-mcp = "container_manager_mcp.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
container-manager-mcp = "container_manager_mcp.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
container-manager-mcp = "container_manager_mcp.connectors"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
container-manager-mcp = "container_manager_mcp"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
container_manager_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "container_manager_mcp*",]

[tool.vulture]
ignore_names = ["request", "config", "connector", "stream"]
exclude = [".venv", "venv", "tests/"]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
