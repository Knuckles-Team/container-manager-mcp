name: Build|Upload|Release Python Package

on:
  push:
    branches:
      - 'main'
    # Image pin refresh follows publication of the exact public wheel.
    paths-ignore:
      - 'docker/Dockerfile'
      - '.bumpversion.cfg'

permissions:
  contents: read

jobs:
  publish-pypi:
    uses: Knuckles-Team/pipelines/.github/workflows/python_pipeline.yml@main
    permissions:
      contents: write
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
